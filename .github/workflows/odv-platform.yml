name: Platform CI

on:
  push:
    branches: [master, main]
    paths:
      - 'platform/**'
      - '.github/client-api-surface.txt'
      - '.github/workflows/odv-platform.yml'
      - '.github/scripts/check-client-config.sh'
      - '.github/scripts/client-api-sweep.sh'
  pull_request:
    branches: [master, main]
    paths:
      - 'platform/**'
      - '.github/client-api-surface.txt'
      - '.github/workflows/odv-platform.yml'
      - '.github/scripts/check-client-config.sh'
      - '.github/scripts/client-api-sweep.sh'

jobs:
  api:
    name: API build and test
    runs-on: ubuntu-22.04

    # The integration suite needs a real PostgreSQL. A service container is
    # ready before the first step runs, so there is no sleep to get wrong.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: odv
          POSTGRES_PASSWORD: odvtest
          POSTGRES_DB: odv
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U odv -d odv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Must satisfy the go directive in platform/api/go.mod.
          go-version-file: platform/api/go.mod
          cache-dependency-path: platform/api/go.sum

      - name: Download dependencies
        working-directory: platform/api
        run: go mod download

      - name: Build
        working-directory: platform/api
        run: go build ./...

      - name: Vet
        working-directory: platform/api
        run: go vet ./...

      - name: Test
        working-directory: platform/api
        run: go test ./...

      # The schema is applied by the embedded migration runner, the same one the
      # API uses at startup, so a migration that does not apply cleanly fails
      # here rather than in production.
      - name: Integration tests against PostgreSQL
        working-directory: platform/api
        run: go test ./internal/integration/ -v
        env:
          ODV_TEST_DB: '1'
          ODV_TEST_PG_HOST: 127.0.0.1
          ODV_TEST_PG_PORT: '55432'
          ODV_TEST_PG_DB: odv
          ODV_TEST_PG_USER: odv
          ODV_TEST_PG_PASSWORD: odvtest

      # Pinned rather than @latest. @latest makes the build depend on whatever
      # was published this morning, which is both a supply-chain surface and a
      # source of failures unrelated to the commit under test. The vulnerability
      # database is fetched at run time regardless, so pinning the tool does not
      # pin the findings: a new CVE still fails this step tomorrow.
      - name: Vulnerability scan
        working-directory: platform/api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  portal:
    name: Portal build and test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/web/package-lock.json

      - name: Install
        working-directory: platform/web
        run: npm ci

      # Before this step existed the lint script could not run at all: there
      # was no ESLint config anywhere in platform/web, so `npm run lint` failed
      # with "couldn't find a configuration file" and nothing noticed, because
      # nothing called it.
      - name: Lint
        working-directory: platform/web
        run: npm run lint

      - name: Build
        working-directory: platform/web
        run: npm run build

      - name: Test
        working-directory: platform/web
        run: npm test

  deployment:
    name: Deployment and client configuration
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # check-client-config.sh deliberately does not run here. It guards a client
      # build, and this job builds no client: it ran here for months reporting
      # success over four variables nothing consumed, while the workflows that do
      # build APKs never set them. It now runs in odv-android, odv-linux and
      # odv-windows, where there is an artifact to check it against.

      # The client's API surface is a closed set. If an upstream merge
      # introduces a new endpoint, this fails the build instead of the endpoint
      # being discovered months later. The sweep script explains how the
      # baseline is derived and what to do when it changes.
      - name: Client API surface has not drifted
        run: bash .github/scripts/client-api-sweep.sh --check

      - name: Check docker-compose
        working-directory: platform
        run: docker compose config
        env:
          PUBLIC_HOST: example.com
          POSTGRES_DB: odv
          POSTGRES_USER: odv
          POSTGRES_PASSWORD: ci-placeholder
          OIDC_CLIENT_SECRET: ci-placeholder
          JWT_SECRET: ci-placeholder
          RUSTDESK_PUBLIC_KEY: ci-placeholder
          API_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
          KEYCLOAK_ADMIN_PASSWORD: ci-placeholder
          KEYCLOAK_DB_PASSWORD: ci-placeholder
          # Both are declared with the ${VAR:?message} form in the compose file,
          # so leaving them out here would fail this step rather than being
          # silently substituted with an empty string. That is the point of the
          # form, and it is why they are listed rather than defaulted.
          POSTGRES_APP_PASSWORD: ci-placeholder
          DEVICE_PASSWORD_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
