name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - 'libs/hbb_common/**'
      - '.github/workflows/odv-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flutter/**'
      - 'libs/hbb_common/**'
      - '.github/workflows/odv-android.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'
  RUST_VERSION: '1.82.0'

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Client configuration guard
        run: |
          bash .github/scripts/check-client-config.sh
        env:
          RS_PUB_KEY: ${{ vars.RS_PUB_KEY }}
          RENDEZVOUS_SERVERS: ${{ vars.RENDEZVOUS_SERVERS }}
          API_SERVER: ${{ vars.API_SERVER }}
          APP_NAME: ${{ vars.APP_NAME || 'OpenDeskViewer' }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: arm64-v8a,armeabi-v7a,x86_64,x86

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Build Rust FFI for Android
        run: |
          cd flutter
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "Building Rust FFI for $abi..."
            cargo ndk -t $abi build --release -p hbb_common 2>&1 || true
          done

      - name: Run flutter_rust_bridge codegen
        run: |
          cd flutter
          dart run build_runner build --delete-conflicting-outputs 2>&1 || true

      - name: Build APK (arm64-v8a)
        run: |
          cd flutter
          flutter build apk --target-platform android-arm64 --release --split-debug-info=./debug-info-arm64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build APK (armeabi-v7a)
        run: |
          cd flutter
          flutter build apk --target-platform android-arm --release --split-debug-info=./debug-info-arm
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build APK (x86_64)
        run: |
          cd flutter
          flutter build apk --target-platform android-x64 --release --split-debug-info=./debug-info-x64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build AAB
        run: |
          cd flutter
          flutter build appbundle --target-platform android-arm64,android-arm --release --split-debug-info=./debug-info
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Sign APKs (debug keys)
        run: |
          cd flutter/build/app/outputs/apk/release
          for apk in app-*-release-*.apk; do
            if [ -f "$apk" ] && [ "$apk" != "app-*-release-*.apk" ]; then
              jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore /dev/null -storepass changeit -keypass changeit \
                "$apk" androiddebugkey 2>/dev/null || true
              apksigner sign --v1-signing-enabled true --v2-signing-enabled true \
                --ks /dev/null --ks-pass pass:changeit --ks-key-alias androiddebugkey \
                --key-pass pass:changeit "$apk" 2>/dev/null || true
            fi
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            flutter/build/app/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: |
            flutter/build/app/outputs/bundle/release/*.aab
          retention-days: 7
