# Inherited from upstream RustDesk, which only tracked git submodules. That
# left the fork's own dependency surface -- the Go API and the React portal --
# with no update path at all, which is how github.com/jackc/pgx/v5 sat at
# v5.7.0 carrying a reachable SQL injection (GO-2026-5004) until a govulncheck
# run found it by hand.
#
# target-branch matters here: this repository's default branch is master, and a
# dependabot entry aimed at a branch that does not exist opens no pull requests
# and reports no error.
#
# Scoped deliberately to platform/ only. The two entries that used to sit here,
# "gitsubmodule" and "github-actions", both watched upstream's surface rather
# than ours and between them opened six pull requests nobody wanted:
#
#   - gitsubmodule tracks libs/hbb_common, which is upstream's submodule. Its
#     pointer should move when we merge RustDesk, not on a daily bot schedule
#     that would silently desync the submodule from the tree that expects it.
#   - github-actions cannot be scoped to a subset of .github/workflows, so it
#     swept RustDesk's build workflows -- now disabled in this repository -- and
#     proposed bumps to actions that never run here. Re-add it if the odv-*
#     workflows are ever worth watching on their own; accept that it will bump
#     the upstream files too.
version: 2
updates:
  # The platform API. Grouped so a routine patch sweep is one pull request
  # rather than a dozen; security updates still arrive on their own.
  - package-ecosystem: "gomod"
    directory: "/platform/api"
    target-branch: "master"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "platform/api"
    labels:
      - "dependencies"
      - "platform"
    groups:
      go-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/platform/web"
    target-branch: "master"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "platform/web"
    labels:
      - "dependencies"
      - "platform"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
