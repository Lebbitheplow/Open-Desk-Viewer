# Inherited from upstream RustDesk, which only tracked git submodules. That
# left the fork's own dependency surface -- the Go API and the React portal --
# with no update path at all, which is how github.com/jackc/pgx/v5 sat at
# v5.7.0 carrying a reachable SQL injection (GO-2026-5004) until a govulncheck
# run found it by hand.
#
# target-branch matters here: this repository's default branch is master, and a
# dependabot entry aimed at a branch that does not exist opens no pull requests
# and reports no error.
version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "Git submodule"
    labels:
      - "dependencies"

  # The platform API. Grouped so a routine patch sweep is one pull request
  # rather than a dozen; security updates still arrive on their own.
  - package-ecosystem: "gomod"
    directory: "/platform/api"
    target-branch: "master"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "platform/api"
    labels:
      - "dependencies"
      - "platform"
    groups:
      go-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/platform/web"
    target-branch: "master"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "platform/web"
    labels:
      - "dependencies"
      - "platform"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The workflows themselves. actions/checkout and friends are pinned by major
  # tag, which is a moving target; this at least surfaces when a major lands.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI"
    labels:
      - "dependencies"
