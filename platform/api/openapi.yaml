  /api/v1/users:
    get:
      summary: List portal users
      operationId: listPortalUsers
      tags:
        - Portal
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Current'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PortalUser'
    post:
      summary: Create a user account
      description: >
        Creates the account in Keycloak and the local row in one step, and
        grants the role if one is named. The temporary password is returned
        exactly once, in this response, and is stored nowhere: the account
        carries the UPDATE_PASSWORD required action, so it is spent on first
        sign-in. Hand it to the person out of band.


        Answers 503 when the deployment has not configured Keycloak admin
        access, because a local row whose account does not exist is a user who
        can never sign in.
      operationId: createPortalUser
      tags:
        - Portal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                  description: Defaults to the email address.
                role:
                  type: string
                  description: >
                    One of the roles GET /api/v1/settings reports. Omitted means
                    the account holds no role and is refused by every screen
                    until one is granted.
      responses:
        '201':
          description: The created user, with its one-time temporary password
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PortalUser'
                  - type: object
                    properties:
                      temporary_password:
                        type: string
        '400':
          description: Invalid email address or unknown role
        '409':
          description: That email already has an account
        '502':
          description: The identity provider refused to create the account
        '503':
          description: Keycloak admin access is not configured

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: User detail, with roles and support group memberships
      operationId: getPortalUser
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
    patch:
      summary: Activate or deactivate a user
      description: >
        Deactivation takes effect on the next request, not the next sign-in:
        the JWT middleware rejects a disabled user. An administrator cannot
        deactivate their own account.
      operationId: updatePortalUser
      tags:
        - Portal
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                display_name:
                  type: string
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
        '400':
          description: >
            You cannot deactivate your own account, or the only active
            administrator.
    delete:
      summary: Remove a user account
      description: >
        Removes the Keycloak account as well as the local row, and refuses if it
        cannot: a local-only delete is not a removal, because the person signs in
        again and is provisioned afresh as a Technician.


        Removal rotates the connection password of every device the user could
        reach, in force at each device's next heartbeat, because a password they
        were shown goes on working until it is changed. The audit trail survives
        them: audit_events has no foreign key to users.


        A machine identity's Keycloak account belongs to the client it hangs off
        rather than to this route, so for a service account only the local row
        and its roles are removed.
      operationId: deletePortalUser
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user was removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  identity_account_removed:
                    type: boolean
                  passwords_rotated:
                    type: integer
                  rotation_in_force:
                    type: string
        '400':
          description: >
            You cannot remove your own account, or the only active
            administrator.
        '404':
          description: No such user
        '502':
          description: The identity provider refused to remove the account
        '503':
          description: Keycloak admin access is not configured

  /api/v1/users/{id}/roles:
