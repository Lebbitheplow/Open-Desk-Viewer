openapi: 3.0.3
info:
  title: OpenDeskViewer RustDesk Pro API
  version: 1.0.0
  description: |
    RustDesk Pro-compatible API for OpenDeskViewer management platform.
    This API is consumed by the unmodified RustDesk client.
    
    All endpoints use snake_case and return `{"error": "..."}` on failure.
    Pagination uses `?current=&pageSize=` with response `{total, data}`.
    Authentication: `Authorization: Bearer <token>` for authenticated endpoints.

servers:
  - url: http://localhost:8000

paths:
  # ========== Authentication ==========

  /api/login-options:
    get:
      summary: Get available login options
      description: Returns list of available authentication methods (OIDC only).
      operationId: getLoginOptions
      tags:
        - Auth
      responses:
        '200':
          description: List of login options
          content:
            application/json:
              schema:
                type: object
                properties:
                  loginOptions:
                    type: array
                    items:
                      type: string
                      examples: ["common-oidc/[]"]
                required:
                  - loginOptions

  /api/login:
    post:
      summary: User login
      description: >
        Exchanges a validated Keycloak token, sent as `secret`, for a session.
        This is where the client's browser sign-in ends up.


        A username and a password are refused with 400: password sign-in is not
        enabled, and migration 000012 dropped the credential store behind it,
        because nothing could ever write a credential to it. Identity lives in
        Keycloak.
      operationId: postLogin
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Password sign-in is not enabled; use single sign-on

  /api/logout:
    post:
      summary: User logout
      description: Terminate the current session.
      operationId: postLogout
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful

  /api/currentUser:
    get:
      summary: Get current user info
      description: Returns information about the authenticated user.
      operationId: getCurrentUser
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPayload'

  # ========== OIDC Authentication ==========

  /api/oidc/auth:
    post:
      summary: Start a browser sign-in
      description: >-
        The RustDesk client cannot host a redirect URI, so it asks for a URL and
        a polling handle, opens the URL in the user's browser, and then polls
        /api/oidc/auth-query until the browser half finishes.

        The exchange runs as the public odv-portal client with PKCE. No client
        secret is involved anywhere in this flow: the code verifier is what
        proves the exchange belongs to the party that started it.
      operationId: postOidcAuth
      tags:
        - OIDC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                op:
                  type: string
                  description: The identity provider the client picked. Recorded, not branched on; this deployment has one.
                id:
                  type: string
                  description: The client's RustDesk id. The poll must present the same one.
                uuid:
                  type: string
                  description: The client's machine uuid. Likewise.
              required:
                - id
                - uuid
      responses:
        '200':
          description: The polling handle and the URL to open in a browser
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: The polling handle. Sent to /api/oidc/auth-query; only its SHA-256 is stored.
                  url:
                    type: string
                    description: Keycloak's authorization endpoint with state and a PKCE S256 challenge.
                required:
                  - code
                  - url
        '400':
          description: Missing id or uuid
        '405':
          description: Method not allowed

  /api/oidc/auth-query:
    get:
      summary: Collect a finished browser sign-in
      description: >-
        Answers 200 with {"error": "No authed oidc is found"} while the browser
        half has not finished. The client matches that string exactly and keeps
        polling; any other message ends its loop with a failure, so it is a
        contract rather than a wording choice.

        Once the callback has completed, this mints and returns a session token.
        A completed sign-in is collectable once.
      operationId: getOidcAuthQuery
      tags:
        - OIDC
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: uuid
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Either the session, or the pending marker
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      access_token:
                        type: string
                      type:
                        type: string
                        enum: [access_token]
                      user:
                        $ref: '#/components/schemas/UserPayload'
                  - type: object
                    properties:
                      error:
                        type: string
                        enum: ["No authed oidc is found"]
        '403':
          description: The account is disabled
        '405':
          description: Method not allowed

  /api/oidc/callback:
    get:
      summary: Where Keycloak sends the browser
      description: >-
        Not called by the client. Verifies the state against a sign-in this
        server started, exchanges the authorization code with PKCE, validates
        the returned token against the same issuer and audience every other
        route requires, and records which user authenticated. Renders a page
        telling the user to return to the application; it carries no token.
      operationId: getOidcCallback
      tags:
        - OIDC
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '200':
          description: An HTML page, sign-in complete or cancelled
          content:
            text/html:
              schema:
                type: string
        '400':
          description: A missing, unknown or expired state
        '401':
          description: The token returned by the identity provider failed validation
        '502':
          description: The identity provider refused the exchange

  # ========== Address Book (ab) ==========

  /api/ab/settings:
    get:
      summary: Get address book settings
      description: Returns address book configuration including device group permissions.
      operationId: getAbSettings
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Address book settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  ab_id:
                    type: string
                    description: Unique address book ID
                  name:
                    type: string
                    description: Address book name
                  device_groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceGroup'
                required:
                  - ab_id
                  - name

  /api/ab/personal:
    get:
      summary: Get personal address book
      description: Returns user's personal address book (legacy endpoint).
      operationId: getAbPersonal
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Personal address book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressBook'

  /api/ab/shared/profiles:
    get:
      summary: Get shared address book profiles
      description: Returns list of address book profiles the user has access to.
      operationId: getAbSharedProfiles
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of address book profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddressBookProfile'
                  total:
                    type: integer
                required:
                  - data
                  - total

  /api/ab/peers:
    get:
      summary: Get peers in address book
      description: Returns devices in a specific address book with pagination.
      operationId: getAbPeers
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      parameters:
        - name: ab
          in: query
          required: true
          schema:
            type: string
            description: Address book ID (GUID)
        - name: current
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            description: Search keyword
      responses:
        '200':
          description: Peers list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPeers'

  /api/ab/tags/{guid}:
    get:
      summary: Get address book tags
      description: Returns tags for a specific address book.
      operationId: getAbTags
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tags list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
                required:
                  - data

  # Mutations answer 200 with an EMPTY body. The client treats any content on a
  # 200 as an error message (_jsonDecodeActionResp in ab_model.dart).
  # Only the personal book is writable; the shared books are projections of the
  # fleet and answer 403.
  /api/ab/peer/add/{guid}:
    post:
      summary: Add a peer to an address book
      description: Adds a peer to the personal address book. Re-adding an existing id updates it.
      operationId: postAbPeerAdd
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AbGuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbPeer'
      responses:
        '200':
          description: Success, with an empty body
        '403':
          description: The book is read-only or not accessible

  /api/ab/peer/update/{guid}:
    put:
      summary: Update a peer
      description: >
        Partial update. Only the fields present in the body are changed, so an
        omitted field is left alone rather than cleared.
      operationId: putAbPeerUpdate
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AbGuid'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                alias:
                  type: string
                note:
                  type: string
                hash:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                forceAlwaysRelay:
                  type: string
                rdpPort:
                  type: string
                rdpUsername:
                  type: string
              required:
                - id
      responses:
        '200':
          description: Success, with an empty body
        '403':
          description: The book is read-only or not accessible
        '404':
          description: No such peer in this book

  /api/ab/peer/{guid}:
    delete:
      summary: Delete peers
      operationId: deleteAbPeers
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AbGuid'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              description: RustDesk ids to remove
      responses:
        '200':
          description: Success, with an empty body
        '403':
          description: The book is read-only or not accessible

  /api/ab/tag/add/{guid}:
    post:
      summary: Add a tag
      operationId: postAbTagAdd
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AbGuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbTag'
      responses:
        '200':
          description: Success, with an empty body
        '403':
          description: The book is read-only or not accessible

  /api/ab/tag/rename/{guid}:
    put:
      summary: Rename a tag
      description: Renames the tag and rewrites it across every peer that carries it.
      operationId: putAbTagRename
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AbGuid'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                old:
                  type: string
                new:
                  type: string
              required:
                - old
                - new
      responses:
        '200':
          description: Success, with an empty body
        '403':
          description: The book is read-only or not accessible
        '404':
          description: No such tag in this book

  /api/ab/tag/update/{guid}:
    put:
      summary: Set a tag colour
      operationId: putAbTagUpdate
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AbGuid'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbTag'
      responses:
        '200':
          description: Success, with an empty body
        '403':
          description: The book is read-only or not accessible
        '404':
          description: No such tag in this book

  /api/ab/tag/{guid}:
    delete:
      summary: Delete tags
      description: Removes the tags and strips them from every peer that carries them.
      operationId: deleteAbTags
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AbGuid'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: Success, with an empty body
        '403':
          description: The book is read-only or not accessible

  /api/ab/get:
    post:
      summary: Legacy address book query
      description: Legacy endpoint for older clients.
      operationId: postAbGet
      tags:
        - AddressBook
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
      responses:
        '200':
          description: Address book data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressBook'

  # ========== Device Groups ==========

  /api/device-group/accessible:
    get:
      summary: Get accessible device groups
      description: Returns device groups the user can access.
      operationId: getDeviceGroupAccessible
      tags:
        - DeviceGroup
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accessible device groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceGroup'
                required:
                  - data

  # ========== Users ==========

  /api/users:
    get:
      summary: Get users list
      description: Returns list of users in the system.
      operationId: getUsers
      tags:
        - User
      security:
        - bearerAuth: []
      parameters:
        - name: current
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Users list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total:
                    type: integer
                required:
                  - data
                  - total

  # ========== Peers (Devices) ==========

  /api/peers:
    get:
      summary: Get peers list
      description: Returns all peers in the system (Admin only).
      operationId: getPeers
      tags:
        - Peer
      security:
        - bearerAuth: []
      parameters:
        - name: current
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Peers list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Peer'
                  total:
                    type: integer
                required:
                  - data
                  - total

  # ========== Heartbeat & Sysinfo ==========

  /api/heartbeat:
    post:
      summary: Device heartbeat
      description: Device sends periodic heartbeat to indicate online status.
      operationId: postHeartbeat
      tags:
        - Device
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Device ID (rustdesk_id)
                uuid:
                  type: string
                  description: Hardware UUID
                online:
                  type: boolean
                peers:
                  type: array
                  items:
                    type: object
                  description: Peers list for shared ab
                username:
                  type: string
                  description: Logged-in username
                name:
                  type: string
                  description: Device name
                status:
                  type: string
                  enum: [online, offline]
                disconnect:
                  type: array
                  items:
                    type: integer
                  description: Connection IDs to disconnect
                strategy:
                  type: object
                  description: Central config push
              required:
                - id
                - uuid
      responses:
        '200':
          description: Heartbeat response
          content:
            application/json:
              schema:
                type: object
                properties:
                  disconnect:
                    type: array
                    items:
                      type: integer
                    description: Connection IDs to close
                  strategy:
                    type: object
                    description: Central config to push
                  username:
                    type: string
                  name:
                    type: string
                  platform:
                    type: string
                  status:
                    type: string
                  online:
                    type: boolean

  /api/sysinfo:
    post:
      summary: Device sysinfo
      description: Device sends system information (CPU, memory, disk, OS version).
      operationId: postSysinfo
      tags:
        - Device
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Device ID
                uuid:
                  type: string
                  description: Hardware UUID
                username:
                  type: string
                  description: Desktop username
                hostname:
                  type: string
                  description: System hostname
                platform:
                  type: string
                  enum: [Windows, Linux, macOS, Android, iOS]
                version:
                  type: string
                  description: Client version (e.g., 1.2.3)
                os:
                  type: string
                  description: Full OS version string
                serial:
                  type: string
                  description: Hardware serial number (optional)
                device_group_name:
                  type: string
                  description: Preset device group name from enrollment
                address_book_name:
                  type: string
                  description: Preset address book name from enrollment
              required:
                - id
                - uuid
                - username
                - hostname
                - platform
                - version
                - os
      responses:
        '200':
          description: Sysinfo received

  /api/sysinfo_ver:
    post:
      summary: Device sysinfo version
      description: Version-specific sysinfo endpoint.
      operationId: postSysinfoVer
      tags:
        - Device
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                version:
                  type: string
              required:
                - id
                - version
      responses:
        '200':
          description: Version received

  # ========== Audit ==========

  /api/audit/conn:
    post:
      summary: Record connection audit
      description: >-
        Records one connection session. The actor is taken from the bearer
        token, never from the body, and the device must be one the caller can
        reach: a user_id in the body is ignored and an unreachable or unknown
        device is 403. The device may be named by its RustDesk id (the stock
        client's "id") or by our uuid ("device_id").
      operationId: postAuditConn
      tags:
        - Audit
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The device's RustDesk id, as the stock client sends it.
                device_id:
                  type: string
                  description: The device, by RustDesk id or by uuid. Takes precedence over id.
                action:
                  type: string
                  enum: [new, close]
                  description: Stock-client form of status. close maps to ENDED.
                conn_id:
                  type: integer
                  format: int64
                session_id:
                  type: integer
                  format: int64
                  description: The client's session id, an unsigned 64-bit value.
                ip:
                  type: string
                  description: Fallback for connected_from.
                support_group_id:
                  type: string
                  format: uuid
                  description: >-
                    Stored only if the caller belongs to it, or is an
                    administrator. Any other value is dropped, not rejected.
                client_id:
                  type: string
                protocol:
                  type: string
                start_time:
                  type: string
                  format: date-time
                  description: RFC 3339. Defaults to now.
                end_time:
                  type: string
                  format: date-time
                duration_seconds:
                  type: integer
                connected_from:
                  type: string
                status:
                  type: string
                  enum: [REQUESTED, STARTED, ENDED, FAILED]
      responses:
        '200':
          description: Audit event recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  guid:
                    type: string
                    format: uuid
                required:
                  - guid
        '400':
          description: Missing device, unparseable timestamp, or a status outside the enum
        '401':
          description: No authenticated user
        '403':
          description: The device is unknown to this deployment, or not reachable by the caller

  /api/audit/file:
    post:
      summary: Record file transfer audit
      description: >-
        Same authorisation rules as /api/audit/conn. The actor comes from the
        token and the device must be reachable by the caller.
      operationId: postAuditFile
      tags:
        - Audit
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The device's RustDesk id.
                device_id:
                  type: string
                  description: The device, by RustDesk id or by uuid. Takes precedence over id.
                file_name:
                  type: string
                direction:
                  type: string
                file_path:
                  type: string
                size:
                  type: integer
                  format: int64
                timestamp:
                  type: string
      responses:
        '200':
          description: File audit event recorded
        '400':
          description: Missing device
        '401':
          description: No authenticated user
        '403':
          description: The device is unknown to this deployment, or not reachable by the caller

  # ========== Device Deployment (optional - for managed clients) ==========

  /api/devices/deploy:
    post:
      summary: Device deployment
      description: Push configuration to managed devices.
      operationId: postDevicesDeploy
      tags:
        - Device
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                peer_id:
                  type: string
                uuid:
                  type: string
                username:
                  type: string
                platform:
                  type: string
                config:
                  type: object
              required:
                - id
                - peer_id
                - uuid
                - username
                - platform
      responses:
        '200':
          description: Deployment command sent

  /api/devices/cli:
    post:
      summary: Send CLI command to device
      operationId: postDevicesCli
      tags:
        - Device
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                peer_id:
                  type: string
                uuid:
                  type: string
                username:
                  type: string
                platform:
                  type: string
                command:
                  type: string
              required:
                - id
                - peer_id
                - uuid
                - username
                - platform
                - command
      responses:
        '200':
          description: CLI command sent

  /api/record:
    post:
      summary: Upload session recording
      operationId: postRecord
      tags:
        - Audit
      security:
        - bearerAuth: []
      responses:
        '501':
          description: Session recording is not enabled

  /api/switch-grant:
    post:
      summary: Request approval to switch control sides
      operationId: postSwitchGrant
      tags:
        - Control
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                peer_id:
                  type: string
                uuid:
                  type: string
                timestamp:
                  type: string
                switch_code_verifier:
                  type: string
                signature:
                  type: string
              required:
                - id
                - peer_id
                - uuid
                - timestamp
                - switch_code_verifier
                - signature
      responses:
        '200':
          description: Switch grant approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean

  /lic/web/api/plugin-sign:
    post:
      summary: Verify plugin signature
      operationId: postPluginSign
      tags:
        - Plugin
      security:
        - bearerAuth: []
      responses:
        '501':
          description: Plugin signing verification is not enabled

  # ==========================================================================
  # /api/v1: the management surface the React portal uses.
  #
  # Separate from the paths above, which exist to satisfy the RustDesk client's
  # fixed contract. These shapes may change with the product; the client's may
  # not. Every path here is on the protected mux and every list returns the
  # {total, current, pageSize, totalPages, data} envelope.
  # ==========================================================================

  /api/v1/stats/dashboard:
    get:
      summary: Fleet summary and the ten most recent connections
      description: >
        Counts are scoped by access.Resolver: an administrator sees the fleet,
        a technician sees only the devices their support groups reach.
      operationId: getDashboard
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    $ref: '#/components/schemas/PortalStats'
                  recent_connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortalSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/devices:
    get:
      summary: List devices
      operationId: listDevices
      tags:
        - Portal
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: >-
            Substring match on device name, hostname or serial number. Name and
            hostname are trigram-indexed; serial is not, so prefer the `serial`
            parameter when the exact value is known.
          schema:
            type: string
        - name: serial
          in: query
          description: >-
            Exact serial number or asset tag. This is how an external system
            turns an identifier it already holds into a device id before
            renaming the device with PATCH /api/v1/devices/{id}.
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [DISCOVERED, ACTIVE, DISABLED, DECOMMISSIONED]
        - name: customer
          in: query
          schema:
            type: string
            format: uuid
        - name: group
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Current'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PortalDevice'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/devices/{id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      summary: Device detail, including sysinfo and group memberships
      operationId: getDevice
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalDeviceDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      summary: Rename a device or move it to another customer or location
      operationId: updateDevice
      tags:
        - Portal
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                customer_id:
                  type: string
                location_id:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a device
      operationId: deleteDevice
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/devices/{id}/claim:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      summary: Claim a DISCOVERED device, making it ACTIVE
      description: >
        Only a DISCOVERED device can be claimed. Claiming an already-active
        device returns 409 rather than silently reassigning it, because that
        would bypass the reassignment path that revokes the old access.
      operationId: claimDevice
      tags:
        - Portal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  format: uuid
                location_id:
                  type: string
                name:
                  type: string
              required:
                - customer_id
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '409':
          description: The device is not awaiting claim

  /api/v1/devices/{id}/reassign:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      summary: Move a device to another customer
      description: >
        Transactional. Updates the customer and location, clears the device's
        group memberships and applies the supplied ones, and writes the audit
        event, all in one transaction. A partial reassignment would leave the
        device reachable by two customers at once.
      operationId: reassignDevice
      tags:
        - Portal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  format: uuid
                location_id:
                  type: string
                device_group_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
                - customer_id
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/devices/{id}/connect:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      summary: Get the rustdesk:// URI for a device
      description: >
        The URI carries no password. A permanent credential in a URL lands in
        browser history, and this deployment has no short-lived credential
        store, so the client prompts instead.
      operationId: connectDevice
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The connect URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  uri:
                    type: string
                    example: rustdesk://connect/100000001
                  rustdesk_id:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/devices/{id}/sessions:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/Current'
      - $ref: '#/components/parameters/PageSize'
    get:
      summary: Connections involving this device
      operationId: listDeviceSessions
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A page of sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PortalSession'

  /api/v1/devices/{id}/disconnect:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      summary: End live sessions on this device
      description: >-
        Queues a disconnect for the device's next heartbeat. It is not
        immediate: the client polls every 15 seconds, applies the connection ids
        it is given, and acknowledges nothing. With no conn_ids the platform
        ends every session it believes is open on the device.
      operationId: disconnectDevice
      tags:
        - Portal
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                conn_ids:
                  type: array
                  items:
                    type: integer
                    format: int32
      responses:
        '200':
          description: Disconnects queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued:
                    type: integer
                  delivered_at_heartbeat:
                    type: boolean
        '403':
          description: Not authorised for this device

  /api/v1/devices/{id}/strategy:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      summary: Read the configuration pushed to this device
      operationId: getDeviceStrategy
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The device's configuration and the version the client compares against
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_options:
                    type: object
                    additionalProperties:
                      type: string
                  modified_at:
                    type: integer
                    format: int64
                  pushable_keys:
                    type: array
                    items:
                      type: string
    put:
      summary: Push configuration to this device
      description: >-
        Administrator only. Only keys in pushable_keys are accepted: the server
        identity keys (custom-rendezvous-server, api-server, relay-server, key)
        are locked at the client build and pushing them here would reopen the
        fleet-redirection path they are locked against. Applied at the device's
        next heartbeat.
      operationId: putDeviceStrategy
      tags:
        - Portal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config_options:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Configuration stored, pending delivery
        '400':
          description: A config option outside the pushable set
        '403':
          description: Administrator access required

  /api/v1/devices/{id}/password:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      summary: Read the device's platform-managed connection password
      description: >-
        The password the device checks when somebody connects to it. It is
        generated by the platform, encrypted at rest, and released only to a
        caller who passes CanAccessDevice for this device. Every release writes
        a device.password_revealed audit event naming the caller.

        applied says whether the device has confirmed the current version. False
        means the machine is still accepting the previous password, because a
        rotation only reaches a device on its next heartbeat.
      operationId: getDevicePassword
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current connection password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePassword'
        '403':
          description: Not authorised for this device
        '404':
          description: The device has not yet received a password

  /api/v1/devices/{id}/password/rotate:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      summary: Rotate the device's connection password
      description: >-
        Administrator only. Generates a new password and delivers it at the
        device's next heartbeat. Until the device confirms it, the previous
        password still works there, which is why the response reports applied
        as false.

        Rotation also happens automatically when access is withdrawn: removing a
        technician from a support group, or revoking a device group from one,
        rotates the passwords of the devices that change hands.
      operationId: rotateDevicePassword
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The new connection password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePassword'
        '403':
          description: Administrator access required
        '404':
          description: No such device

  /api/v1/devices/{id}/connectivity:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/Current'
      - $ref: '#/components/parameters/PageSize'
    get:
      summary: This device's connectivity history
      description: >-
        One entry per change of connectivity, recorded by the worker at the
        moment it changes the device. Transitions rather than samples: a fleet
        that is behaving costs no rows, and an operator asks when a machine went
        down and for how long, not what it was doing at 14:32.
      operationId: getDeviceConnectivityHistory
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The device's connectivity events, most recent first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectivityEventPage'
        '403':
          description: Not authorised for this device

  /api/v1/monitoring/events:
    parameters:
      - $ref: '#/components/parameters/Current'
      - $ref: '#/components/parameters/PageSize'
      - name: since
        in: query
        description: RFC 3339. Defaults to seven days ago, so a first page is bounded.
        schema:
          type: string
          format: date-time
      - name: connectivity
        in: query
        description: Filter to one state, such as OFFLINE.
        schema:
          type: string
    get:
      summary: Fleet-wide connectivity history
      description: >-
        Administrator, manager or Read Only. A technician's answer scoped to
        their own support group would be a different and more misleading number
        than the one this question is asking for.
      operationId: getFleetConnectivityHistory
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Connectivity events across the fleet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectivityEventPage'
        '400':
          description: since is not an RFC 3339 timestamp
        '403':
          description: Administrator access required

  /api/v1/notification-targets:
    get:
      summary: List webhook targets
      description: >-
        The secret is never returned, only whether one is set. A screen that
        displays it is a screen that leaks it.
      operationId: getNotificationTargets
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The configured targets and their delivery health
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationTarget'
        '403':
          description: Administrator access required
    post:
      summary: Add a webhook target
      description: >-
        Administrator only. The URL must be https: the payload names devices and
        customers and is one of the few things this platform sends off its own
        network.

        Webhooks rather than email is a deliberate choice. Email needs an SMTP
        server, credentials, a sender domain with SPF and DKIM and a bounce
        story; a webhook needs a URL, and an operator who wants email points one
        at something that already sends it.
      operationId: createNotificationTarget
      tags:
        - Portal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                url:
                  type: string
                secret:
                  description: Optional. Signs each body with HMAC-SHA256, sent as X-ODV-Signature.
                  type: string
                event_types:
                  description: Empty means every event.
                  type: array
                  items:
                    type: string
                    enum: [device.offline, device.stale, device.online]
                enabled:
                  type: boolean
              required:
                - name
                - url
      responses:
        '201':
          description: Target created
        '400':
          description: A missing name, or a URL that is not https
        '403':
          description: Administrator access required
        '409':
          description: A target with that name already exists

  /api/v1/notification-targets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Remove a webhook target
      operationId: deleteNotificationTarget
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Target removed
        '403':
          description: Administrator access required
        '404':
          description: No such target

  /api/v1/notification-deliveries:
    parameters:
      - $ref: '#/components/parameters/Current'
      - $ref: '#/components/parameters/PageSize'
      - name: state
        in: query
        schema:
          type: string
          enum: [pending, delivered, abandoned]
    get:
      summary: The notification outbox
      description: >-
        Whether an alert actually went out. Abandoned deliveries are kept rather
        than deleted, because "which notifications never arrived" is a question
        somebody has after an incident, and a queue that discards its failures
        cannot answer it.
      operationId: getNotificationDeliveries
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deliveries, most recent first
        '403':
          description: Administrator access required

  /api/v1/device-observations:
    parameters:
      - $ref: '#/components/parameters/Current'
      - $ref: '#/components/parameters/PageSize'
    get:
      summary: Device ids seen without a credential
      description: >-
        Heartbeats from ids that hold no valid enrollment credential. These are
        recorded rather than registered, which is what replaced the previous
        behaviour of adding any unknown id to the fleet. A device provisioned
        but never enrolled appears here, and so does anything probing the
        endpoint.
      operationId: listDeviceObservations
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A page of observations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            rustdesk_id:
                              type: string
                            device_uuid:
                              type: string
                              nullable: true
                            client_ip:
                              type: string
                              nullable: true
                            first_seen_at:
                              type: string
                              format: date-time
                            last_seen_at:
                              type: string
                              format: date-time
                            sightings:
                              type: integer
                              format: int64
        '403':
          description: Administrator access required

  /api/enroll:
    post:
      summary: Redeem an enrollment token
      description: >-
        The one device endpoint that needs no credential, because it is where
        the credential comes from. The device presents an enrollment token and
        its RustDesk id, and receives a device_token it presents on every later
        heartbeat. Redeeming again for a device that already exists replaces its
        credential, which is how a reimaged device returns; crossing customers
        is refused.
      operationId: enrollDevice
      tags:
        - Device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                id:
                  type: string
                  description: The device's RustDesk id.
                uuid:
                  type: string
                hostname:
                  type: string
                os:
                  type: string
                version:
                  type: string
              required:
                - token
                - id
      responses:
        '200':
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  device_token:
                    type: string
                    description: Returned once. The device stores it and presents it on every heartbeat.
        '401':
          description: Unknown, expired, exhausted or revoked token
        '409':
          description: This device id belongs to another customer

  /api/v1/customers:
    get:
      summary: List customers
      operationId: listCustomers
      tags:
        - Portal
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Current'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PortalCustomer'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a customer
      operationId: createCustomer
      tags:
        - Portal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                name:
                  type: string
                external_id:
                  type: string
                description:
                  type: string
              required:
                - code
                - name
      responses:
        '201':
          description: The created customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalCustomer'
        '409':
          description: A customer with that code already exists

  /api/v1/customers/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      summary: Customer detail
      operationId: getCustomer
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalCustomer'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a customer
      operationId: updateCustomer
      tags:
        - Portal
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                name:
                  type: string
                external_id:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: The updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalCustomer'
    delete:
      summary: Delete a customer
      description: >
        Devices reference customers with ON DELETE SET NULL, so their devices
        are orphaned rather than deleted.
      operationId: deleteCustomer
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/v1/customers/{id}/locations:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      summary: List a customer's locations
      operationId: listLocations
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A page of locations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PortalLocation'
    post:
      summary: Add a location to a customer
      operationId: createLocation
      tags:
        - Portal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                external_id:
                  type: string
                address:
                  type: string
              required:
                - name
      responses:
        '201':
          description: The created location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalLocation'

  /api/v1/customers/{id}/locations/{locationId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: locationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update a location
      operationId: updateLocation
      tags:
        - Portal
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                external_id:
                  type: string
                address:
                  type: string
      responses:
        '200':
          description: The updated location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalLocation'
    delete:
      summary: Delete a location
      operationId: deleteLocation
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/device-groups:
    get:
      summary: List device groups
      operationId: listDeviceGroups
      tags:
        - Portal
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Current'
