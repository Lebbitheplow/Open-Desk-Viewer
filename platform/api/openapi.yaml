                          $ref: '#/components/schemas/PortalAuditEvent'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/audit/sessions:
    get:
      summary: Connection log
      description: >
        Scoped by access: a technician sees only sessions on devices they can
        reach, so the connection log is not a way to enumerate the fleet.
      operationId: listAuditSessions
      tags:
        - Portal
      security:
        - bearerAuth: []
      parameters:
        - name: device
          in: query
          schema:
            type: string
            format: uuid
        - name: user
          in: query
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Current'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PortalSession'

  /api/v1/reports/{report}:
    parameters:
      - name: report
        in: path
        required: true
        schema:
          type: string
          enum: [device-inventory, session-history, access-review]
      - name: format
        in: query
        description: csv returns a downloadable file; anything else returns JSON.
        schema:
          type: string
          enum: [json, csv]
      - name: from
        in: query
        description: RFC 3339. session-history only; defaults to thirty days ago.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
    get:
      summary: Run a report
      description: >-
        Three reports over data the platform already keeps: what machines are
        managed and whether they are alive (device-inventory), who connected to
        what and for how long (session-history), and who *could* connect to what
        (access-review).

        The last is the one an access review actually asks, and it is derived
        from the same support-group chain the API enforces rather than from the
        group tables read by hand, so a reviewer cannot sign off on a picture
        that differs from what is enforced.

        Administrator, manager or Read Only. A report scoped to one technician's
        support groups is a filtered list rather than a report, and offering it
        as one would let somebody sign off a review over a fraction of the
        fleet. Running a report writes a report.generated audit event.
      operationId: getReport
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The report, as JSON or as a CSV attachment
          content:
            application/json:
              schema:
                type: object
                properties:
                  report:
                    type: string
                  generated_at:
                    type: string
                    format: date-time
                  columns:
                    type: array
                    items:
                      type: string
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
            text/csv:
              schema:
                type: string
        '403':
          description: Administrator access required
        '404':
          description: No such report

  /api/v1/settings:
    get:
      summary: Deployment settings
      description: >
        Read-only, and sourced from the process configuration rather than a
        settings table. Making them editable needs a config table and a reload
        path, which is out of scope for 1.0.
      operationId: getSettings
      tags:
        - Portal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSettings'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Current:
      name: current
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Rows per page. Capped at 500 by the server.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 10
    DeviceId:
      name: id
      in: path
      required: true
      description: The device's uuid.
      schema:
        type: string
        format: uuid
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      description: Inclusive lower bound. RFC 3339, or a bare YYYY-MM-DD date.
      schema:
        type: string
    To:
      name: to
      in: query
      description: Inclusive upper bound. RFC 3339, or a bare YYYY-MM-DD date.
      schema:
        type: string
    AbGuid:
      name: guid
      in: path
      required: true
      description: >
        The address book's guid. For the personal book this is the id returned
        by /api/ab/personal; for a shared book it is the support group's own id,
        or the fixed fleet guid 00000000-0000-0000-0000-0000000000fe.
      schema:
        type: string
        format: uuid

  schemas:
    ConnectivityEventPage:
      type: object
      properties:
        total:
          type: integer
        current:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConnectivityEvent'
    ConnectivityEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        device_id:
          type: string
          format: uuid
        device_name:
          type: string
        connectivity:
          description: The state entered.
          type: string
        previous_duration_seconds:
          description: How long the device had been unheard from when this was recorded.
          type: integer
          format: int64
          nullable: true
        occurred_at:
          type: string
          format: date-time
    NotificationTarget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        has_secret:
          description: Whether deliveries to this target are signed. The secret itself is never returned.
          type: boolean
        event_types:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        last_success_at:
          type: string
          format: date-time
          nullable: true
        last_failure_at:
          type: string
          format: date-time
          nullable: true
        last_failure_reason:
          type: string
          nullable: true
        consecutive_failures:
          type: integer
        created_at:
          type: string
          format: date-time
    DevicePassword:
      type: object
      description: >-
        A device's platform-managed connection password. version is what the
        device echoes on its heartbeat once it has applied the password, so
        applied_version lagging version means the rotation has not reached the
        machine yet and the previous password still works there.
      properties:
        password:
          type: string
        version:
          type: integer
          format: int64
        applied_version:
          type: integer
          format: int64
          nullable: true
        applied:
          type: boolean
        applied_at:
          type: string
          format: date-time
          nullable: true
        rotated_at:
          type: string
          format: date-time
        delivered_at_heartbeat:
          type: boolean
    AbPeer:
      type: object
      description: An address book entry, as flutter/lib/models/peer_model.dart models it.
      properties:
        id:
          type: string
          description: The peer's RustDesk id
        hash:
          type: string
          description: Password hash, personal books only
        username:
          type: string
        hostname:
          type: string
        platform:
          type: string
          enum: [Windows, Linux, Mac OS, Android]
        alias:
          type: string
        note:
          type: string
        tags:
          type: array
          items:
            type: string
        forceAlwaysRelay:
          type: string
          description: Serialised as the string "true" or "false", not as a bool
          enum: ["true", "false"]
        rdpPort:
          type: string
        rdpUsername:
          type: string
        loginName:
          type: string
          description: The owning customer, on shared books
        device_group_name:
          type: string
      required:
        - id

    AbTag:
      type: object
      properties:
        name:
          type: string
        color:
          type: integer
          format: int64
          description: A Flutter ARGB Color.value, which does not fit in int32
      required:
        - name

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        pin:
          type: string
        id:
          type: string
        uuid:
          type: string
        token:
          type: string
        hash:
          type: boolean
        self_host:
          type: boolean
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, failure]
        token:
          type: string
        error:
          type: string
        privacy_mode:
          type: string
      required:
        - status

    UserPayload:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [Admin, User, Guest]
        token:
          type: string
        avatar:
          type: string
        settings:
          type: object
        groups:
          type: array
          items:
            type: string
      required:
        - id
        - username
        - email
        - role
        - token

    AddressBook:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ab_id:
          type: string
        peers:
          type: array
          items:
            $ref: '#/components/schemas/Peer'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
      required:
        - id
        - name
        - peers

    AddressBookProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ab_id:
          type: string
        shared_ab_ids:
          type: array
          items:
            type: string
      required:
        - id
        - name

    Peer:
      type: object
      properties:
        id:
          type: string
          description: Device ID (rustdesk_id)
        uuid:
          type: string
        username:
          type: string
        hostname:
          type: string
        platform:
          type: string
          enum: [Windows, Linux, macOS, Android, iOS]
        tags:
          type: string
        online:
          type: boolean
        status:
          type: string
          enum: [online, offline]
        connect_status:
          type: string
        login_name:
          type: string
        last_connected_at:
          type: string
          format: date-time
        device_group_id:
          type: string
        customer_id:
          type: string
        location_id:
          type: string
      required:
        - id
        - uuid
        - username
        - hostname
        - platform

    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        ab_id:
          type: string
      required:
        - id
        - name

    DeviceGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
        peers:
          type: array
          items:
            $ref: '#/components/schemas/Peer'
      required:
        - id
        - name

    PaginatedPeers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Peer'
        total:
          type: integer
        current:
          type: integer
        pageSize:
          type: integer
      required:
        - data
        - total

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
        active:
          type: boolean
        last_login:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - username
        - email
        - role

    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rustdesk_id:
          type: string
        name:
          type: string
        uuid:
          type: string
        serial_number:
          type: string
        customer_id:
          type: string
        location_id:
          type: string
        state:
          type: string
          enum: [DISCOVERED, PROVISIONING, ACTIVE, DISABLED, DECOMMISSIONED]
        connectivity:
          type: string
          enum: [ONLINE, STALE, OFFLINE, UNKNOWN]
        last_seen_at:
          type: string
          format: date-time
        client_version:
          type: string
        os:
          type: string
        hostname:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - rustdesk_id
        - name
        - state
        - connectivity

    ApiV1Error:
      type: object
      properties:
        error:
          type: string

    PageEnvelope:
      description: >
        The list envelope. total is the count matching the filters, not the
        length of data, so a client paging with `while current * pageSize <
        total` terminates correctly.
      type: object
      properties:
        total:
          type: integer
          format: int64
        current:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64

    PortalStats:
      type: object
      properties:
        total_devices:
          type: integer
          format: int64
        discovered_devices:
          type: integer
          format: int64
        active_devices:
          type: integer
          format: int64
        stale_devices:
          type: integer
          format: int64
        offline_devices:
          type: integer
          format: int64
        online_now:
          type: integer
          format: int64
        total_customers:
          type: integer
          format: int64
        total_technicians:
          type: integer
          format: int64
        connections_24h:
          type: integer
          format: int64

    PortalDevice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rustdesk_id:
          type: string
        name:
          type: string
        hostname:
          type: string
        os:
          type: string
        state:
          type: string
          enum: [DISCOVERED, ACTIVE, DISABLED, DECOMMISSIONED]
        connectivity:
          type: string
          enum: [ONLINE, STALE, OFFLINE, UNKNOWN]
        last_seen_at:
          type: string
          format: date-time
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        location_id:
          type: string
          format: uuid
        location_name:
          type: string
        client_version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PortalDeviceDetail:
      allOf:
        - $ref: '#/components/schemas/PortalDevice'
        - type: object
          properties:
            serial_number:
              type: string
            groups:
              type: array
              items:
                $ref: '#/components/schemas/PortalGroupSummary'
            sysinfo:
              $ref: '#/components/schemas/PortalSysinfo'

    PortalSysinfo:
      type: object
      properties:
        cpu:
          type: string
        memory:
          type: string
        disk:
          type: string
        network:
          type: array
          items:
            type: string
        software:
          type: array
          items:
            type: string
        collected_at:
          type: string
          format: date-time

    PortalGroupSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    PortalCustomer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        external_id:
          type: string
        description:
          type: string
        device_count:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PortalLocation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        name:
          type: string
        external_id:
          type: string
        address:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PortalDeviceGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
        member_count:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PortalSupportGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        technicians:
          type: array
          items:
            $ref: '#/components/schemas/PortalTechnician'
        device_groups:
          type: array
          items:
            $ref: '#/components/schemas/PortalGroupSummary'
        member_count:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PortalTechnician:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        display_name:
          type: string
        active:
          type: boolean

    PortalUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        keycloak_subject:
          type: string
        email:
          type: string
        display_name:
          type: string
        active:
          type: boolean
        roles:
          type: array
          items:
            type: string
        support_groups:
          type: array
          items:
            $ref: '#/components/schemas/PortalGroupSummary'
        last_login:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    PortalSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        device_name:
          type: string
        user_id:
          type: integer
          format: int64
        user_email:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        duration_seconds:
          type: integer
        status:
          type: string
          enum: [REQUESTED, STARTED, ENDED, FAILED]
        connected_from:
          type: string
        note:
          description: The operator note attached by PUT /api/audit.
          type: string

    PortalAuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
          example: device.reassigned
        user_id:
          type: integer
          format: int64
        user_email:
          type: string
        device_id:
          type: string
          format: uuid
        device_name:
          type: string
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        support_group_id:
          type: string
          format: uuid
        description:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    PortalEnrollmentToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        prefix:
          type: string
        token:
          description: The plaintext value. Present only in the creation response.
          type: string
        customer_id:
          type: string
          format: uuid
        max_uses:
          type: integer
        uses:
          type: integer
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    PortalSettings:
      type: object
      properties:
        address_book_max_peers:
          type: integer
        audit_retention_days:
          type: integer
        device_stale_after_seconds:
          type: integer
        device_offline_after_seconds:
          type: integer
        editable:
          description: Always false in 1.0; settings come from the process environment.
          type: boolean
        roles:
          description: >-
            Every role this deployment has, read from the roles table so the
            portal's grant control cannot offer one the grant endpoint would
            reject. It offered "Manager" for exactly that reason; the role is
            called "Support Manager".
          type: array
          items:
            type: string
        caller_roles:
          description: >-
            The signed-in user's own roles, so the portal can hide controls that
            would 403. The API refuses regardless; this is a usability field and
            not a security one.
          type: array
          items:
            type: string

  responses:
    Success:
      description: The operation succeeded
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
    Unauthorized:
      description: No valid credential was presented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiV1Error'
    Forbidden:
      description: >
        The caller is authenticated but not authorised. Device endpoints return
        403 rather than 404 for a device outside the caller's support groups, so
        the response does not confirm that the id exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiV1Error'
    NotFound:
      description: No such record
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiV1Error'
